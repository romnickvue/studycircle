<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <aside class="auth-brand">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" class="auth-logo" />
        <p class="auth-brand-name">StudyCircle</p>
        <p class="auth-brand-tag">Learn Together.<br />Move Forward Together.</p>
      </aside>

      <div class="auth-panel">
        <h1>Welcome Back!</h1>
        <p class="auth-sub">Sign in to continue your academic journey.</p>

        <form id="sign-in-form">
          <div class="auth-field">
            <i class="bi bi-person"></i>
            <input type="email" id="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required />
          </div>

          <div class="auth-field">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required />
            <button type="button" class="toggle-password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>

          <p id="form-error" class="form-error" hidden></p>

          <div class="auth-row"><a href="forgot-password.html">Forgot password?</a></div>

          <button type="submit" class="auth-submit">Sign In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/password-toggle.js"></script>
  <script src="../js/pages/sign-in.js"></script>
</body>
</html>
