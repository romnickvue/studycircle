<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <aside class="auth-brand">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" class="auth-logo" />
        <p class="auth-brand-name">StudyCircle</p>
        <p class="auth-brand-tag">Learn Together.<br />Move Forward Together.</p>
      </aside>

      <div class="auth-panel">
        <h1>Create Your Account</h1>
        <p class="auth-sub">Join StudyCircle and start your learning journey.</p>

        <form id="register-form">
          <div class="auth-field">
            <i class="bi bi-person"></i>
            <input type="text" id="display-name" placeholder="Full name" aria-label="Full name" autocomplete="name" required />
          </div>

          <div class="auth-field">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required />
          </div>

          <div class="auth-field">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" placeholder="Password (at least 6 characters)" aria-label="Password" autocomplete="new-password" required minlength="6" />
            <button type="button" class="toggle-password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>

          <div class="auth-field">
            <i class="bi bi-lock"></i>
            <input type="password" id="confirm-password" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password" required minlength="6" />
            <button type="button" class="toggle-password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>

          <p id="form-error" class="form-error" hidden></p>

          <button type="submit" class="auth-submit">Register</button>
        </form>

        <p id="success-message" class="auth-success" hidden>
          Check your email to confirm your account before signing in.
        </p>

        <p class="auth-switch">Already have an account? <a href="sign-in.html">Sign in</a></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/password-toggle.js"></script>
  <script src="../js/pages/register.js"></script>
</body>
</html>
