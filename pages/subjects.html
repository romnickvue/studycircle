<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/sidebar-links.js"></script>

  <div class="app-shell">
    <aside class="sidebar group-mode">
      <nav>
        <ul>
          <li><a href="group-overview.html"><i class="bi bi-grid"></i> Overview</a></li>
          <li><a href="subjects.html" class="active"><i class="bi bi-journal-bookmark"></i> Subjects</a></li>
          <li><a href="activities.html"><i class="bi bi-list-task"></i> Academic Activities</a></li>
          <li><a href="group-calendar.html"><i class="bi bi-calendar3"></i> Group Calendar</a></li>
          <li><a href="members.html"><i class="bi bi-people"></i> Members</a></li>
          <li><a href="group-settings.html"><i class="bi bi-gear"></i> Group Settings</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" />
        <p class="app-name">StudyCircle</p>
        <p class="tagline">Learn together. Move forward together.</p>
        <p class="copyright">&copy; 2026 StudyCircle</p>
        </div>
    </aside>

    <main class="content">
      <p><a href="#" id="back-to-group-link">&larr; Back to Group Overview</a></p>
      <h1>Subjects</h1>

      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

      <div id="subjects-list" hidden></div>

      <div id="subjects-empty" class="empty-state" hidden>
        <p>Add your first subject.</p>
      </div>

      <button id="add-subject-btn">+ Add Subject</button>

      <div id="subject-modal" class="modal-overlay" hidden>
        <div class="modal">
          <button class="modal-close" onclick="closeModal('subject-modal')">&times;</button>
          <h3>Add Subject</h3>

          <form id="subject-form">
            <label for="subject-name">Name</label>
            <input type="text" id="subject-name" required />

            <label for="subject-code">Code (optional)</label>
            <input type="text" id="subject-code" />

            <p id="subject-error" class="form-error" hidden></p>

            <button type="submit">Save</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/services/subjects.service.js"></script>
  <script src="../js/utils/drawer.js"></script>
  <script src="../js/pages/subjects.js"></script>
</body>
</html>
