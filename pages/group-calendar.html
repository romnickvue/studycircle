<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Calendar — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/dates.js"></script>

  <div class="app-shell">
    <aside class="sidebar group-mode">
      <nav>
        <ul>
          <li><a href="group-overview.html">Overview</a></li>
          <li><a href="subjects.html">Subjects</a></li>
          <li><a href="activities.html">Academic Activities</a></li>
          <li><a href="group-calendar.html">Group Calendar</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="group-settings.html">Group Settings</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" />
        <p class="app-name">StudyCircle</p>
        <p class="tagline">Learn together. Move forward together.</p>
        <p class="copyright">&copy; 2026 StudyCircle</p>
      </div>
    </aside>

    <main class="content">
      <h1 id="calendar-title"></h1>

      <div>
        <button id="prev-month-btn">&lt; Prev</button>
        <button id="next-month-btn">Next &gt;</button>
      </div>

      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 700px;"></div>

      <div id="cal-grid" class="cal-grid" hidden></div>

      <div id="day-modal" class="modal-overlay" hidden>
        <div class="modal">
          <button class="modal-close" onclick="closeModal('day-modal')">&times;</button>
          <h3 id="day-modal-title"></h3>
          <div id="day-modal-list"></div>
        </div>
      </div>

      <div id="activity-modal" class="modal-overlay" hidden>
        <div class="modal">
          <button class="modal-close" onclick="closeModal('activity-modal')">&times;</button>
          <h3>New Activity</h3>

          <form id="activity-form">
            <label for="activity-title">Title</label>
            <input type="text" id="activity-title" required />

            <label for="activity-type">Type</label>
            <select id="activity-type" required>
              <option value="QUIZ">Quiz</option>
              <option value="ASSIGNMENT">Assignment</option>
              <option value="EXAM">Exam</option>
              <option value="PROJECT">Project</option>
              <option value="RECITATION">Recitation</option>
              <option value="PRESENTATION">Presentation</option>
              <option value="OTHER">Other</option>
            </select>

            <label for="activity-subject">Subject (optional)</label>
            <select id="activity-subject">
              <option value="">— None —</option>
            </select>

            <label for="activity-due">Due date</label>
            <input type="date" id="activity-due" required />

            <p id="activity-error" class="form-error" hidden></p>

            <button type="submit">Create</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/services/activities.service.js"></script>
  <script src="../js/utils/sidebar-links.js"></script>
  <script src="../js/services/subjects.service.js"></script>
  <script src="../js/utils/drawer.js"></script>
  <script src="../js/pages/group-calendar.js"></script>
</body>
</html>
