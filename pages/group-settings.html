<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Settings — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/services/invitations.service.js"></script>
  <script src="../js/services/members.service.js"></script>
  <script src="../js/utils/toast.js"></script>

  <div class="app-shell">
    <aside class="sidebar group-mode">
      <nav>
        <ul>
          <li><a href="group-overview.html"><i class="bi bi-grid"></i> Overview</a></li>
          <li><a href="subjects.html"><i class="bi bi-journal-bookmark"></i> Subjects</a></li>
          <li><a href="activities.html"><i class="bi bi-list-task"></i> Tasks</a></li>
          <li><a href="group-calendar.html"><i class="bi bi-calendar3"></i> Group Calendar</a></li>
          <li><a href="members.html"><i class="bi bi-people"></i> Members</a></li>
          <li><a href="group-settings.html" class="active"><i class="bi bi-gear"></i> Group Settings</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" />
        <p class="app-name">StudyCircle</p>
        <p class="tagline">Learn together. Move forward together.</p>
        <p class="copyright">&copy; 2026 StudyCircle</p>
      </div>
    </aside>

    <main class="content">
      <h1>Group Settings</h1>

      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

      <div id="admin-section" hidden>
        <h2>Group Details</h2>
        <form id="settings-form">
          <label for="group-name">Group name</label>
          <input type="text" id="group-name" required />

          <label for="group-description">Description</label>
          <input type="text" id="group-description" />

          <p id="form-error" class="form-error" hidden></p>

          <button type="submit">Save Changes</button>
        </form>

        <h2>Group Icon</h2>
        <div id="icon-picker" class="icon-picker"></div>

        <h2>Invitation</h2>
        <button id="generate-invite-btn">Generate Invitation Link</button>

        <div id="active-invite" hidden>
          <p>Invite link: <code id="invite-link-text"></code></p>
          <p>Expires: <span id="invite-expiry-text"></span></p>
          <button id="copy-invite-btn">Copy Link</button>
          <button id="regenerate-invite-btn">Regenerate</button>
        </div>
      </div>

      <h2>Membership</h2>
      <button id="leave-group-btn" class="btn-destructive">Leave Group</button>
    </main>
  </div>

  <script src="../js/services/groups.service.js"></script>
  <script src="../js/utils/sidebar-links.js"></script>
  <script src="../js/utils/drawer.js"></script>
  <script src="../js/pages/group-settings.js"></script>
</body>
</html>
