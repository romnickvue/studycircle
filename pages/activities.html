<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/dates.js"></script>

  <div class="app-shell">
    <aside class="sidebar group-mode">
      <nav>
        <ul>
          <li><a href="group-overview.html"><i class="bi bi-grid"></i> Overview</a></li>
          <li><a href="subjects.html"><i class="bi bi-journal-bookmark"></i> Subjects</a></li>
          <li><a href="activities.html" class="active"><i class="bi bi-list-task"></i> Tasks</a></li>
          <li><a href="group-calendar.html"><i class="bi bi-calendar3"></i> Group Calendar</a></li>
          <li><a href="members.html"><i class="bi bi-people"></i> Members</a></li>
          <li><a href="group-settings.html"><i class="bi bi-gear"></i> Group Settings</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" />
        <p class="app-name">StudyCircle</p>
        <p class="tagline">Learn together. Move forward together.</p>
        <p class="copyright">&copy; 2026 StudyCircle</p>
      </div>
    </aside>

    <main class="content">
      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

      <div id="tasks-panel" class="neo-card group-panel" hidden>
        <div class="panel-header">
          <div class="neo-icon-circle"><i class="bi bi-calendar-check"></i></div>
          <div class="panel-heading">
            <h2>Tasks</h2>
            <p class="panel-sub"><span id="month-label"></span> · group tasks and important dates</p>
          </div>
          <button type="button" id="add-activity-btn" class="pill-btn"><i class="bi bi-plus-lg"></i> New Task</button>
        </div>

        <div id="overdue-section">
          <h3>Overdue <span class="section-count" id="overdue-count">0</span></h3>
          <div id="overdue-list"></div>
        </div>

        <div id="pending-section">
          <h3>Pending <span class="section-count" id="pending-count">0</span></h3>
          <div id="pending-list"></div>
        </div>

        <div id="completed-section">
          <h3>Completed <span class="section-count" id="completed-count">0</span></h3>
          <div id="completed-list"></div>
        </div>

        <div id="activities-empty" class="empty-state" hidden>
          <p>No tasks this month.</p>
        </div>
      </div>

      <div id="activity-modal" class="modal-overlay" hidden>
        <div class="modal">
          <button class="modal-close" onclick="closeModal('activity-modal')">&times;</button>
          <h3>New Activity</h3>

          <form id="activity-form">
            <label for="activity-title">Title</label>
            <input type="text" id="activity-title" required />

            <label for="activity-type">Type</label>
            <select id="activity-type" required>
              <option value="QUIZ">Quiz</option>
              <option value="ASSIGNMENT">Assignment</option>
              <option value="EXAM">Exam</option>
              <option value="PROJECT">Project</option>
              <option value="RECITATION">Recitation</option>
              <option value="PRESENTATION">Presentation</option>
              <option value="OTHER">Other</option>
            </select>

            <label for="activity-subject">Subject (optional)</label>
            <select id="activity-subject">
              <option value="">— None —</option>
            </select>

            <label for="activity-due">Due date</label>
            <input type="date" id="activity-due" />

            <p id="activity-error" class="form-error" hidden></p>

            <button type="submit">Create</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/services/subjects.service.js"></script>
  <script src="../js/services/activities.service.js"></script>
  <script src="../js/utils/sidebar-links.js"></script>
  <script src="../js/utils/drawer.js"></script>
    <script src="../js/services/progress.service.js"></script>
  <script src="../js/pages/activities.js"></script>
</body>
</html>
