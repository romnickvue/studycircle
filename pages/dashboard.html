<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/dates.js"></script>

  <div class="app-shell">
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="dashboard.html" class="active">Dashboard</a></li>
          <li><a href="tasks.html">My Tasks</a></li>
          <li><a href="#">Calendar</a></li>
          <li><a href="groups.html">My Groups</a></li>
          <li><a href="#">Profile</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <h1 id="greeting"></h1>

      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

      <div id="dashboard-content" hidden>
        <div id="overdue-section" hidden>
          <h2>Overdue</h2>
          <div id="overdue-list"></div>
        </div>

        <div id="today-section">
          <h2>Today</h2>
          <div id="today-list"></div>
        </div>

        <div id="soon-section">
          <h2>Due Soon</h2>
          <div id="soon-list"></div>
        </div>

        <div id="all-caught-up" class="empty-state" hidden>
          <p>You're all caught up!</p>
        </div>

        <h2>My Groups</h2>
        <div id="groups-list"></div>
        <button id="create-group-btn">+ Create a Group</button>

        <div id="no-groups-state" class="empty-state" hidden>
          <p>Create a group or join one with an invitation.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/services/groups.service.js"></script>
  <script src="../js/services/activities.service.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
