<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/dates.js"></script>

  <div class="app-shell">
    <aside class="sidebar personal-mode">
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="tasks.html">My Tasks</a></li>
          <li><a href="calendar.html">Calendar</a></li>
          <li><a href="groups.html">My Groups</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" />
        <p class="app-name">StudyCircle</p>
        <p class="tagline">Learn together. Move forward together.</p>
        <p class="copyright">&copy; 2026 StudyCircle</p>
      </div>
    </aside>

    <nav class="bottom-tab-bar">
      <a href="dashboard.html">Dashboard</a>
      <a href="tasks.html" class="active">My Tasks</a>
      <a href="calendar.html">Calendar</a>
      <a href="groups.html">My Groups</a>
      <a href="#">Profile</a>
    </nav>

    <main class="content">
      <h1>My Tasks</h1>
        <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

        <div id="tasks-content" hidden>
          <div id="today-section">
            <h3>Today</h3>
            <div id="today-list"></div>
          </div>

          <div id="soon-section">
            <h3>Due Soon</h3>
            <div id="soon-list"></div>
          </div>

          <div id="completed-section">
            <h3>Completed</h3>
            <div id="completed-list"></div>
          </div>

          <div id="overdue-section">
            <h3>Overdue</h3>
            <div id="overdue-list"></div>
          </div>

          <div id="all-caught-up" class="empty-state" hidden>
            <p>Nothing due this week.</p>
          </div>
        </div>
    </main>
  </div>

  <script src="../js/services/groups.service.js"></script>
  <script src="../js/services/activities.service.js"></script>
  <script src="../js/services/progress.service.js"></script>
  <script src="../js/utils/cards.js"></script>
  <script src="../js/pages/tasks.js"></script>
</body>
</html>
