<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Groups — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/toast.js"></script>

  <div class="app-shell">
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="#">Dashboard</a></li>
          <li><a href="#">My Tasks</a></li>
          <li><a href="#">Calendar</a></li>
          <li><a href="groups.html" class="active">My Groups</a></li>
          <li><a href="#">Profile</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <h1>My Groups</h1>
      <button id="create-group-btn-main">+ Create a Group</button>

      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 300px;"></div>

      <div id="groups-grid" hidden></div>

      <div id="empty-state" class="empty-state" hidden>
        <p>You haven't joined any groups yet.</p>
        <button id="create-group-btn">Create a Group</button>
      </div>

      <div id="create-group-modal" class="modal-overlay" hidden>
        <div class="modal">
            <button class="modal-close" onclick="closeModal('create-group-modal')">&times;</button>
            <h3>Create a Group</h3>

            <form id="create-group-form">
            <label for="new-group-name">Group name</label>
            <input type="text" id="new-group-name" required />

            <label for="new-group-description">Description (optional)</label>
            <input type="text" id="new-group-description" />

            <p id="create-group-error" class="form-error" hidden></p>

            <button type="submit">Create</button>
            </form>
        </div>
    </div>
    </main>
  </div>

  
  <script src="../js/services/groups.service.js"></script>
  <script src="../js/pages/groups.js"></script>
</body>
</html>
