<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-width: 700px;
    }
    .cal-day {
      border: 1px solid var(--color-sage-light);
      border-radius: var(--radius-sm);
      padding: var(--space-1);
      min-height: 70px;
      font-size: 0.85rem;
    }
    .cal-day.other-month {
      opacity: 0.4;
    }
    .cal-day.today {
      border-color: var(--color-text-green);
      border-width: 2px;
    }
    .cal-event {
      background: var(--color-sage-light);
      border-radius: 4px;
      padding: 2px 4px;
      margin-top: 2px;
      cursor: pointer;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/dates.js"></script>
  <script src="../js/utils/modal.js"></script>

  <div class="app-shell">
    <aside class="sidebar personal-mode">
      <nav>
        <ul>
          <li><a href="dashboard.html"><i class="bi bi-house-door"></i> Dashboard</a></li>
          <li><a href="tasks.html"><i class="bi bi-check2-square"></i> My Tasks</a></li>
          <li><a href="calendar.html"><i class="bi bi-calendar3"></i> Calendar</a></li>
          <li><a href="groups.html"><i class="bi bi-people"></i> My Groups</a></li>
          <li><a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" />
        <p class="app-name">StudyCircle</p>
        <p class="tagline">Learn together. Move forward together.</p>
        <p class="copyright">&copy; 2026 StudyCircle</p>
      </div>
    </aside>

    <nav class="bottom-tab-bar">
      <a href="dashboard.html"><i class="bi bi-house-door"></i><span>Dashboard</span></a>
      <a href="tasks.html"><i class="bi bi-check2-square"></i><span>My Tasks</span></a>
      <a href="calendar.html"><i class="bi bi-calendar3"></i><span>Calendar</span></a>
      <a href="groups.html"><i class="bi bi-people"></i><span>My Groups</span></a>
      <a href="profile.html"><i class="bi bi-person-circle"></i><span>Profile</span></a>
    </nav>

    <main class="content">
      <h1 id="calendar-title"></h1>

      <div>
        <button id="prev-month-btn">&lt; Prev</button>
        <button id="next-month-btn">Next &gt;</button>
      </div>

      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 700px;"></div>

      <div class="cal-weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="cal-grid" class="cal-grid" hidden></div>

      <div id="day-modal" class="modal-overlay" hidden>
        <div class="modal">
          <button class="modal-close" onclick="closeModal('day-modal')">&times;</button>
          <h3 id="day-modal-title"></h3>
          <div id="day-modal-list"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/services/groups.service.js"></script>
  <script src="../js/services/activities.service.js"></script>
  <script src="../js/pages/calendar.js"></script>
</body>
</html>
