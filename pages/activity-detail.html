<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Detail — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/dates.js"></script>

  <div class="app-shell">
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="#">Overview</a></li>
          <li><a href="#">Subjects</a></li>
          <li><a href="#">Academic Activities</a></li>
          <li><a href="#">Group Calendar</a></li>
          <li><a href="#">Members</a></li>
          <li><a href="#">Group Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

      <div id="detail-content" hidden>
        <h1 id="activity-title"></h1>
        <p id="activity-type"></p>
        <p id="activity-subject"></p>
        <p id="activity-due"></p>
        <p id="activity-description"></p>

        <label for="status-select">Your status</label>
        <select id="status-select">
          <option value="NOT_STARTED">Not Started</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="COMPLETED">Completed</option>
        </select>
      </div>
    </main>
  </div>

  <script src="../js/services/activities.service.js"></script>
  <script src="../js/services/progress.service.js"></script>
  <script src="../js/pages/activity-detail.js"></script>
</body>
</html>
