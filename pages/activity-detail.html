<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Detail — StudyCircle</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/dates.js"></script>

  <div class="app-shell">
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="group-overview.html">Overview</a></li>
          <li><a href="group-overview.html#subjects-section">Subjects</a></li>
          <li><a href="activities.html">Academic Activities</a></li>
          <li><a href="group-calendar.html">Group Calendar</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="group-settings.html">Group Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <p><a href="#" id="back-to-group-link">&larr; Back to Group Overview</a></p>
      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

      <div id="detail-content" hidden>
        <h1 id="activity-title"></h1>
        <p id="activity-type"></p>
        <p id="activity-subject"></p>
        <p id="activity-due"></p>
        <p id="activity-description"></p>

        <p>Your status:</p>
        <div id="status-buttons">
          <button data-status="NOT_STARTED" class="status-btn">Not Started</button>
          <button data-status="IN_PROGRESS" class="status-btn">In Progress</button>
          <button data-status="COMPLETED" class="status-btn">Completed</button>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/services/activities.service.js"></script>
  <script src="../js/services/progress.service.js"></script>
  <script src="../js/utils/sidebar-links.js"></script>
  <script src="../js/pages/activity-detail.js"></script>
</body>
</html>
