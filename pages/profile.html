<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — StudyCircle</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.local.js"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/route-guard.js"></script>

  <div class="app-shell">
    <aside class="sidebar personal-mode">
      <nav>
        <ul>
          <li><a href="dashboard.html"><i class="bi bi-house-door"></i> Dashboard</a></li>
          <li><a href="tasks.html"><i class="bi bi-check2-square"></i> My Tasks</a></li>
          <li><a href="calendar.html"><i class="bi bi-calendar3"></i> Calendar</a></li>
          <li><a href="groups.html"><i class="bi bi-people"></i> My Groups</a></li>
          <li><a href="profile.html" class="active"><i class="bi bi-person-circle"></i> Profile</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <img src="../assets/images/logo-placeholder.png" alt="StudyCircle logo" />
        <p class="app-name">StudyCircle</p>
        <p class="tagline">Learn together. Move forward together.</p>
        <p class="copyright">&copy; 2026 StudyCircle</p>
      </div>
    </aside>

    <nav class="bottom-tab-bar">
      <a href="dashboard.html"><i class="bi bi-house-door"></i><span>Dashboard</span></a>
      <a href="tasks.html"><i class="bi bi-check2-square"></i><span>My Tasks</span></a>
      <a href="calendar.html"><i class="bi bi-calendar3"></i><span>Calendar</span></a>
      <a href="groups.html"><i class="bi bi-people"></i><span>My Groups</span></a>
      <a href="profile.html" class="active"><i class="bi bi-person-circle"></i><span>Profile</span></a>
    </nav>

    <main class="content">
      <h1>Profile</h1>
      <p class="page-subtitle">Manage your account information and settings.</p>

      <div id="loading-state" class="skeleton skeleton-card" style="max-width: 400px;"></div>

      <div id="profile-content" hidden>
        <div class="neo-card profile-card">
          <div class="profile-avatar">
            <div class="profile-avatar-inner"><i class="bi bi-person-fill"></i></div>
          </div>

          <div class="profile-info">
            <h2 id="profile-name" class="profile-name"></h2>

            <p class="profile-line">
              <i class="bi bi-envelope"></i>
              <span id="profile-email"></span>
            </p>

            <p class="profile-line">
              <i class="bi bi-calendar3"></i>
              <span>Member since <span id="profile-member-since">—</span></span>
            </p>
          </div>
        </div>

        <div class="profile-actions">
          <button type="button" id="edit-info-btn" class="neo-card action-row">
            <span class="neo-icon-circle"><i class="bi bi-pencil-square"></i></span>
            <span class="action-text">
              <span class="action-title">Edit Information</span>
              <span class="action-desc">Update your display name.</span>
            </span>
            <span class="group-arrow-btn"><i class="bi bi-arrow-right"></i></span>
          </button>

          <button type="button" id="change-password-btn" class="neo-card action-row">
            <span class="neo-icon-circle"><i class="bi bi-lock"></i></span>
            <span class="action-text">
              <span class="action-title">Change Password</span>
              <span class="action-desc">Update your password to keep your account secure.</span>
            </span>
            <span class="group-arrow-btn"><i class="bi bi-arrow-right"></i></span>
          </button>

          <button type="button" id="sign-out-btn" class="neo-card action-row">
            <span class="neo-icon-circle"><i class="bi bi-box-arrow-right"></i></span>
            <span class="action-text">
              <span class="action-title">Sign Out</span>
              <span class="action-desc">Sign out from your StudyCircle account.</span>
            </span>
            <span class="group-arrow-btn"><i class="bi bi-arrow-right"></i></span>
          </button>
        </div>
        
      </div>
    </main>

    <div id="edit-modal" class="modal-overlay" hidden>
      <div class="modal">
        <button type="button" class="modal-close" id="edit-close-btn" aria-label="Close">&times;</button>
        <h2>Edit Information</h2>
        <form id="edit-form">
          <label for="edit-display-name">Display name</label>
          <input type="text" id="edit-display-name" maxlength="50" required />
          <p id="edit-error" class="form-error" hidden></p>
          <button type="submit" id="edit-save-btn">Save</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/pages/profile.js"></script>
</body>
</html>
